Title: Spacial Score topological indicator of molecular complexity
Description: This tool computes the Spatial Score (SPS) and its size-normalized 
  variant (nSPS), two empirical descriptors of molecular spatial complexity that
  extend common measures like Fsp3 and FCstereo by capturing molecular topology 
  and three-dimensionality at a granular scale. The normalized score enables 
  comparison across molecules of different sizes and differentiates natural 
  products from synthetic compounds. Analyses of ChEMBL data show trends of 
  increasing potency and selectivity with higher nSPS values.
