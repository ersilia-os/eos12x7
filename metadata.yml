Title: Spacial Score topological indicator of molecular complexity
Description: Computes the spacial score, an empirical measure of molecular topology
  and three-dimensionality that goes beyond counting sp3 carbons or stereocentres
  by weighting every heavy atom for its hybridisation, stereogenicity, membership
  of a non-aromatic ring and number of heavy-atom neighbours. A size-normalised variant
  accompanies the raw score, letting molecules of different sizes be compared and
  separating natural products from synthetic collections; across ChEMBL, higher normalised
  values track with greater potency and selectivity. The calculation is deterministic
  and needs no 3D conformer.
