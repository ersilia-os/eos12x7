Slug: spacial-score-complexity
Status: Ready
Title: Spacial Score topological indicator of molecular complexity
Description: Computes the spatial score, an empirical measure of three-dimensional complexity that goes beyond counting sp3 carbons or stereocentres by weighting each atom for its hybridisation, stereochemistry, ring fusion and substitution. Both the raw score and a size-normalised variant are returned, the latter allowing molecules of different sizes to be compared directly. The calculation is deterministic and requires no conformer, since complexity is inferred from topology rather than geometry.
